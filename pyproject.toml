[project]
name = "repurpose-mcp"
version = "0.1.0"
description = "MCP server for evidence-traceable drug repurposing in rare disease (Open Targets, ChEMBL, ClinicalTrials.gov, PubMed)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "mcp==2.3.0",
]

[project.scripts]
repurpose-mcp = "repurpose_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
